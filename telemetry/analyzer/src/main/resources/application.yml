spring:
  application:
    name: analyzer
  datasource:
    url: jdbc:postgresql://localhost:5432/telemetry_analyzer
    username: dbuser
    password: 12345
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
      separator: "@@"
      schema-locations: classpath:schema.sql

grpc:
  client:
    hub-router:
      address: 'static://localhost:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

analyzer:
  kafka:
    bootstrap-servers: localhost:9092
    retry-delay-ms: 1000
    topics:
      snapshots: telemetry.snapshots.v1
      hubs: telemetry.hubs.v1
    snapshot-consumer:
      group-id: analyzer-snapshots
      client-id: analyzer-snapshots
      auto-offset-reset: latest
      enable-auto-commit: false
      max-poll-records: 1
      poll-timeout: 1000
    hub-consumer:
      group-id: analyzer-hub-events
      client-id: analyzer-hub-events
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
      poll-timeout: 1000
